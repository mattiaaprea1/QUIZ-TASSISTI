<style>

.sub{color:var(--muted);font-size:14px;margin:2px 0 0}

.hidden{display:none!important}
.menu{display:grid;gap:10px}

.opt:hover{border-color:var(--yd)}
.opt b{display:block;font-size:17px}

.opt.main{background:var(--y);border-color:var(--y);color:#14181f}
.opt.main small{color:#3a3410}
.opt:disabled{opacity:.5;cursor:not-allowed}

.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:6px 0 14px}

.ans{display:grid;gap:10px}
.a{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:14px;font-weight:600}
.a .l{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:var(--bg);color:var(--muted)}
.a.sel{border-color:var(--y);background:var(--sel)}
.a.sel .l{background:var(--y);color:#14181f}
.a.ok{border-color:var(--ok);background:var(--okbg)}.a.ok .l{background:var(--ok);color:#fff}
.a.ko{border-color:var(--ko);background:var(--kobg)}.a.ko .l{background:var(--ko);color:#fff}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-weight:600}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.ko{background:var(--kobg);color:var(--ko)}
.go{position:sticky;bottom:0;padding:12px 0 6px;margin-top:10px;background:linear-gradient(transparent,var(--bg) 35%)}
.btn{width:100%;border:0;border-radius:12px;padding:15px;font-weight:800;background:var(--y);color:#14181f;min-height:52px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.alt{background:var(--card);border:1px solid var(--line);color:var(--ink);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.stat b{display:block;font-size:18px}.stat span{font-size:12px;color:var(--muted)}
.res{text-align:center;padding:10px 0}
.verdict{display:inline-block;border-radius:99px;padding:8px 20px;font-weight:800;font-size:18px;margin:8px 0}
.verdict.ok{background:var(--okbg);color:var(--ok)}.verdict.ko{background:var(--kobg);color:var(--ko)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;margin:12px 0}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.row.bad b{color:var(--ko)}

.rev b{display:block;margin-bottom:3px}.rev .no{color:var(--ko)}.rev .yes{color:var(--ok)}
details{text-align:left}summary{cursor:pointer;font-weight:700;padding:8px 0}
.stack{display:grid;gap:10px;margin-top:14px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
