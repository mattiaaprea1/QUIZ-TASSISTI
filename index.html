<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Quiz Preparazione Esame</title>
  <style>
    :root {
      --primary: #1e40af;
      --primary-dark: #1e3a8a;
      --accent: #3b82f6;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --green: #10b981;
      --green-bg: #d1fae5;
      --red: #ef4444;
      --red-bg: #fee2e2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #312e81 100%);
      min-height: 100vh;
      padding: 16px 12px 32px;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    .card {
      background: var(--card-bg);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      background: #f8fafc;
    }
    .brand-title { font-size: 22px; font-weight: 800; color: var(--primary); margin: 0; }
    .main { padding: 24px; }
    .progress-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      color: var(--muted);
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .track {
      height: 8px;
      border-radius: 8px;
      background: #e2e8f0;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--primary));
      width: 0;
      transition: width 0.3s ease;
    }
    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .select {
      min-height: 42px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: white;
      padding: 0 12px;
      font: inherit;
      color: var(--text);
      flex: 1;
      min-width: 140px;
    }
    .pill {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      background: #dbeafe;
      color: var(--primary);
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 16px;
    }
    .question {
      font-size: 20px;
      line-height: 1.4;
      margin: 0 0 20px;
      font-weight: 700;
      white-space: pre-wrap;
    }
    .answers { display: grid; gap: 12px; }
    .answer {
      width: 100%;
      text-align: left;
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      background: #fff;
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s ease;
    }
    .answer .letter {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #f1f5f9;
      display: grid;
      place-items: center;
      font-size: 13px;
      color: var(--muted);
      flex-shrink: 0;
    }
    .answer.selected { border-color: var(--accent); background: #eff6ff; }
    .answer.correct { border-color: var(--green); background: var(--green-bg); }
    .answer.wrong { border-color: var(--red); background: var(--red-bg); }
    .answer.correct .letter { background: #10b981; color: white; }
    .answer.wrong .letter { background: #ef4444; color: white; }
    .feedback {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 10px;
      font-weight: 600;
      display: none;
    }
    .feedback.show { display: block; }
    .feedback.good { background: var(--green-bg); color: #065f46; }
    .feedback.bad { background: var(--red-bg); color: #991b1b; }
    .actions { display: flex; gap: 10px; margin-top: 24px; }
    .btn {
      border: 0;
      border-radius: 12px;
      padding: 14px 20px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .primary { background: var(--primary); color: white; flex: 1; }
    .primary:hover { background: var(--primary-dark); }
    .secondary { background: #f1f5f9; color: var(--text); }
    .secondary:hover { background: #e2e8f0; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .stats { display: flex; gap: 10px; margin-top: 20px; }
    .stat { flex: 1; background: #f8fafc; border-radius: 10px; padding: 10px; text-align: center; border: 1px solid var(--border); }
    .stat strong { display: block; font-size: 18px; }
    .stat span { font-size: 12px; color: var(--muted); }
    .hidden { display: none !important; }
    .result { text-align: center; padding: 20px 10px; }
    .result h2 { font-size: 26px; margin-bottom: 10px; }
    .status-badge {
      display: inline-block;
      padding: 8px 18px;
      border-radius: 30px;
      font-weight: 800;
      font-size: 16px;
      margin: 10px 0 20px;
    }
    .status-badge.passed { background: var(--green-bg); color: #065f46; }
    .status-badge.failed { background: var(--red-bg); color: #991b1b; }
    .review-item { text-align: left; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
    .review-item b { display: block; margin-bottom: 4px; }
    .review-item .ok { color: var(--green); }
    .review-item .no { color: var(--red); }
  </style>
</head>
<body>

<div class="wrap">
  <div class="card">
    <header class="brand">
      <h1 class="brand-title">Quiz di Preparazione</h1>
      <button class="btn secondary" id="homeBtn" type="button">Home</button>
    </header>
    
    <main class="main">
      <div id="quizScreen">
        <div class="progress-row">
          <span id="counter">Domanda 1</span>
          <span id="modeDisplay">Modalità Ripasso</span>
        </div>
        <div class="track"><div class="fill" id="progress"></div></div>

        <div class="toolbar">
          <select class="select" id="modeSelect">
            <option value="practice">Modalità Ripasso</option>
            <option value="exam">Modalità Esame (16 Domande)</option>
          </select>
          <select class="select" id="topicSelect">
            <option value="all">Tutti gli argomenti</option>
            <option value="Geografia">Geografia</option>
            <option value="Normativa Statale e Regionale">Normativa Statale e Regionale</option>
            <option value="Regolamento e Comportamento">Regolamento e Comportamento</option>
            <option value="Inglese">Inglese</option>
          </select>
        </div>

        <div class="pill" id="topicPill">Argomento</div>
        <h2 class="question" id="question">Caricamento in corso...</h2>
        <div class="answers" id="answers"></div>
        <div class="feedback" id="feedback"></div>

        <div class="actions">
          <button class="btn primary" id="nextBtn" type="button" disabled>Conferma risposta</button>
        </div>

        <div class="stats" id="statsRow">
          <div class="stat"><strong id="correctCount">0</strong><span>Corrette</span></div>
          <div class="stat"><strong id="wrongCount">0</strong><span>Errori</span></div>
          <div class="stat"><strong id="remainingCount">0</strong><span>Rimanenti</span></div>
        </div>
      </div>

      <div id="resultScreen" class="hidden result">
        <h2>Risultato Finale</h2>
        <div id="statusBadge" class="status-badge"></div>
        <p id="resultText"></p>
        <div id="topicBreakdown" style="text-align: left; margin: 20px 0; font-size: 14px;"></div>
        <button class="btn primary" id="restartBtn" type="button">Nuova Sessione</button>
        <div class="review-list" id="reviewList" style="margin-top:20px;"></div>
      </div>
    </main>
  </div>
</div>

Normativa Statale e Regionale | Il titolare di licenza taxi può essere sostituito, ai sensi dell’art. 10 della legge 15 gennaio 1992 n. 21, per motivi di salute o inabilità temporanea: | Da altro titolare di licenza taxi di altro comune | Da persone iscritte nel ruolo di cui art. 6 della legge 15 gennaio 1992 n. 21 | Da persone designate dal Prefetto | 2
Normativa Statale e Regionale | Le autovetture adibite al servizio di noleggio con conducente, secondo l’art.12 comma 5 della Legge 15 gennaio 1992 n 21, portano, tra l’altro, una targa: | Inamovibile anteriore con la dicitura “N” | Adesiva posteriore con la dicitura “NC” | Posteriore inamovibile recante la dicitura “NCC” | 3
Normativa Statale e Regionale | Ai sensi dell’art. 9 della legge 15 gennaio 1992 n.21, la licenza per l’esercizio del servizio taxi e l’autorizzazione del servizio di autonoleggio con conducente, sono trasferite su richiesta del titolare, a persona dallo stesso designata, iscritta al ruolo ed in possesso dei requisiti prescritti, purchè il titolare abbia: | Raggiunto il sessantesimo anno d’età | Raggiunto il sessantacinquesimo anno d’età | Raggiunto il sessantesimo anno d’età o almeno trentacinque anni d’esercizio di dell’attività | 1
Normativa Statale e Regionale | Entro quanto tempo, dall’entrata in vigore della Legge 15 gennaio 1992 n.21, i regolamenti comunali per il servizio taxi e noleggio con conducente sono resi conformi alla legge stessa in base al secondo comma dell’art. 15 della medesima legge? | Entro un anno | Entro tre anni | Entro due anni | 3
Normativa Statale e Regionale | Ai sensi dell’art. 5 della L. 21/92, chi stabilisce i requisiti e le condizioni per il rilascio delle licenze taxi e le autorizzazioni NCC? | La Regione | Il Comune | La Provincia | 2
Normativa Statale e Regionale | I titolari di licenza taxi e di autorizzazione di noleggio con conducente, al fine del libero esercizio della propria attività, ai sensi dell’art 7 della legge 15 gennaio 1992 n.21, possono: | Associarsi in consorzio tra imprese artigiane e in tutte le altre forme previste dalla legge | Essere imprenditori privati per svolgere esclusivamente l’esercizio di taxi in due o più comuni | Essere imprenditori pubblici | 1
Normativa Statale e Regionale | La prestazione del servizio di noleggio con conducente, come stabilito dall’art 13 della Legge 15 Gennaio 1992 n.21 è: | Obbligatoria | Tassativa solo se richiesta per motivi di estrema necessità | Non obbligatoria | 3
Normativa Statale e Regionale | Ai sensi dell’art. 2 della Legge 15 Gennaio 1992 n.21, il servizio taxi è rivolto ad una utenza di tipo: | Collettiva differenziata | Indifferenziata individuale o di piccoli gruppi di persone | Individuale differenziata | 2
Normativa Statale e Regionale | Ai sensi dell’art. 3 della Legge 15 gennaio 1992 n. 21, lo stazionamento dei mezzi, nel servizio di noleggio con conducente, avviene: | In appositi parcheggi individuati dai comuni | Sulla pubblica piazza | All’interno delle rimesse o presso i pontili di attracco | 3
Normativa Statale e Regionale | La competenza in materia di trasporto mediante autoservizi pubblici non di linea è affidata ai sensi dell’art. 4 della Legge 15 gennaio 1992 n. 21: | Alla questura territorialmente competente | Alle Regioni e agli enti locali delegati | All’ufficio provinciale della Motorizzazione Civile | 2
Normativa Statale e Regionale | Ai sensi dell’art. 6 della Legge 15 gennaio 1992 n. 21 il ruolo dei conducenti di veicoli o natanti adibiti ad autoservizi pubblici non di linea è istituito presso: | Le province | Le Camere di Commercio, Industria, Artigianato e Agricoltura | Le Regioni | 2
Normativa Statale e Regionale | Ai sensi dell’art. 8 della Legge 15 gennaio 1992 n. 21 è ammesso il cumulo della licenza per l’esercizio del servizio taxi e dell’autorizzazione per l’esercizio del servizio di noleggio con conducente nel caso gli stessi siano esercitati con autovettura? | Si, se l’autovettura da noleggio con conducente è attrezzata per il trasporto di portatori di handicap | No | Si, previa autorizzazione rilasciata dal Presidente della provincia territorialmente competente | 2
Normativa Statale e Regionale | Ai sensi dell’art. 12 della Legge 15 gennaio 1992 n. 21, in quale modo l’utente è portato a conoscenza dell’esistenza di eventuali supplementi tariffari per il servizio taxi? | Mediante communicatione verbale da parte del tassista alla fine della corsa | Mediante avvisi posti in luoghi pubblici | Mediante avviso chiaramente leggibile posto sul cruscotto dell’autovettura | 3
Normativa Statale e Regionale | Ai sensi dell’art. 13 della Legge 15 gennaio 1992 n. 21, nel servizio taxi, la tariffa per il servizio urbano calcolata con tassametro è: | A base multipla | A progressione chilometrica | A tempo di percorrenza | 1
Normativa Statale e Regionale | I titolari di licenza di taxi possono essere sostituiti temporaneamente per l’esercizio del servizio, da persone iscritte al ruolo di cui all’art. 6 della Legge 15 gennaio 1992 n. 21: | Per un periodo di ferie non superiore a giorni trenta annui | Per incarichi in società di capitale | Per il periodo necessario ad acquisire un diploma di laurea | 1
Normativa Statale e Regionale | In base alla Legge 15 gennaio 1992 n. 21, a partire dal 1 gennaio 1992 i veicoli di nuova immatricolazione adibiti ai servizi di noleggio con conducente o al servizio taxi devono essere muniti: | Di estintore nell’eventualità di un incendio a bordo | Di telefono cellulare a servizio dell’utenza | Di marmitta catalitica o di altri dispositivi atti a ridurre i carichi inquinanti | 3
Normativa Statale e Regionale | Il rilascio della licenza per l’esercizio del servizio taxi e dell’autorizzazione per l’esercizio del servizio noleggio con conducente è subordinata: | All’iscrizione al ruolo dei conducenti di cui all’art. 9 della Legge Regionale 15 aprile 1995 n. 20 | Al possesso dell’abilitazione alla guida di autobus di noleggio con conducente | Al possesso del titolo per espletare di responsabile di agenzia turistica | 1
Normativa Statale e Regionale | Ai sensi della Legge 15 gennaio 1992 n. 21, è titolo preferenziale agli effetti del rilascio delle licenze e delle autorizzazioni, l’avere esercitato il servizio taxi in qualità di sostituto alla guida del titolare di licenza: | Per un periodo di tre mesi consecutivi | Per un periodo di tempo complessivo di almeno sei mesi | Per il periodo di tempo necessario a soddisfare l’obbligo del servizio militare | 2
Normativa Statale e Regionale | Chi detta norme ai sensi dell’art. 14 della Legge 15 gennaio 1992 n. 21, per stabilire il numero e il tipo di veicoli già esistenti da attrezzare anche al trasporto di soggetti portatori di handicap di particolare gravità? | Le USL competenti territorialmente | I comuni nell’ambito dei regolamenti | Il Settore Assistenza della Regione Lombardia | 2
Normativa Statale e Regionale | Ai sensi dell’art. 14 della Legge 15 gennaio 1992 n. 21 è consentito che le autovetture di noleggio con conducente siano utilizzate anche per l’esercizio taxi? | Nei servizi aeroportuali | Nei comuni di minori dimensioni | Nelle zone di intensa conurbazione di cui all’art. 8 della Legge Regionale 15 aprile 1995 n. 20 | 2
Normativa Statale e Regionale | Ai sensi dell’art. 13 della Legge 15 gennaio 1992 n. 21 il servizio taxi si effettua: | A richiesta diretta del trasportato o dei trasportati | Solo su richiesta telefonica | Con prenotazione obbligatoria presso le agenzie di viaggio | 1
Normativa Statale e Regionale | Costituiscono autoservizi pubblici non di linea ai sensi della Legge 15 gennaio 1992 n. 21: | Il servizio taxi con autovettura, motocarrozzetta, natante e veicoli con trazione animale | Tutti i servizi non di linea posti in essere dai privati | Tutti i servizi non di linea finanziati da enti locali | 1
Normativa Statale e Regionale | Il servizio taxi si rivolge ad un’utenza di tipo: | Differenziata collettiva | Indifferenziata individuale o collettiva | Differenziata individuale | 2
Normativa Statale e Regionale | Nel servizio di noleggio con conducente lo stazionamento dei mezzi avviene: | In luogo pubblico | In appositi spazi delimitati dai Comuni | All’interno delle rimesse o presso i pontili d’attracco | 3
Normativa Statale e Regionale | A chi è affidata, ai sensi dell’art. 4 della Legge 15 gennaio 1992 n. 21, la competenza in materia di trasporto mediante autoservizi pubblici non di linea? | Alle Regioni | Alla prefettura territorialmente competente | Alla questura del capoluogo di provincia | 1
Normativa Statale e Regionale | Il ruolo dei conducenti di veicoli o natanti adibiti ad autoservizi pubblici non di linea è istituito ai sensi dell’art.6 della Legge 15 gennaio 1992 n. 21 presso: | Le regions | Le camere di commercio, industria, artigianato e agricoltura | I comuni | 2
Normativa Statale e Regionale | Secondo la Legge 15 gennaio 1992 n. 21 è ammesso il cumulo di più licenze per l’esercizio del servizio taxi ovvero il cumulo della licenza per l’esercizio del servizio taxi e dell’autorizzazione per l’esercizio del servizio di noleggio con conducente nel caso gli stessi siano esercitati con autovettura? | Si | No | Si, previa autorizzazione rilasciata dal Presidente della Giunta Regionale | 2
Normativa Statale e Regionale | Ai sensi dell’art. 12 della Legge 15 gennaio 1992 n. 21 le autovetture adibite al servizio di taxi sono munite di tassametro omologato, attraverso la sola lettura del quale è deducibile il corrispettivo da pagare. L’esistenza di un eventuale supplemento tariffario è portata a conoscenza dell’utente: | Mediante comunicazione verbale da parte dello stesso tassista | Mediante avviso chiaramente leggibile posto sul cruscotto dell’autovettura | Mediante comunicazione verbale da parte dello stesso tassista a fine corsa | 2
Normativa Statale e Regionale | I titolari di licenza per l’esercizio del servizio taxi possono essere sostituiti temporaneamente da persone iscritte nel ruolo di cui all’art. 6 Legge 15 gennaio 1992 n. 21, nel caso di chiamata alle armi? | Si | No | Solo in caso di chiamata per ferma prolungata | 1
Normativa Statale e Regionale | A partire dal 1 gennaio 1992 i veicoli di nuova immatricolazione adibiti al servizio di noleggio con conducente o al servizio taxi devono essere muniti in base alla Legge 15 gennaio 1992 n. 21:| Di estintore, nell’eventualità di un incendio a bordo | Di cinture di sicurezza, sui sedili posteriori | Di marmitte catalitiche o di altri dispositivi atti a ridurre i carichi inquinanti | 3
Normativa Statale e Regionale | In caso di morte del titolare la licenza può essere trasferita ad uno degli eredi appartenant al nucleo familiare del titolare qualora in possesso dei requisiti prescritti, ovvero può essere trasferita ad altri: | Dietro autorizzazione del Presidente della Regione | Dietro autorizzazione del Sindaco | Davanti al notaio curatore dell’eredità | 2
Normativa Statale e Regionale | Sono esonerate dall’obbligo del tassametro le autovetture adibite al servizio taxi: | Nei comuni inferiori ai 5.000 abitanti | Nei comuni di minori dimensioni | Mai, in nessun caso | 2
Normativa Statale e Regionale | Le autovetture adibite al servizio di noleggio con conducente portano un contrassegno con la scritta “noleggio”: | All’interno del parabrezza anteriore e sul lunotto posteriore | Solo sul lunotto posteriore | Sulla parte inferiore delle portiere anteriori | 1
Normativa Statale e Regionale | Il rapporto del sostituto alla guida del taxi è regolato con un contratto di lavoro a tempo determinato. A tal fine l’assunzione del sostituto alla guida è equiparata a quella effettuata per sostituire lavoratori assenti, per i quali sussista il diritto alla conservazione del posto, e ciò in base: | Alla legge 18 aprile 1962 n. 230 art. 1, comma 2, lettera h | Al contratto collettivo nazionale dei lavoratori del comparto del trasporto pubblico | Ad un contratto di gestione per un termine non superiore ai 12 mesi | 1
Normativa Statale e Regionale | Gli eredi minori del titolare di licenza possono farsi sostituire alla guida per l’esercizio del servizio taxi da persone iscritte nel ruolo di cui all’art. 6 della Legge 15 gennaio 1992 n. 21 ed in possesso dei requisiti prescritti: | Solo per un tempo massimo di due anni | Solo fino al conseguimento della prescritta licenza taxi | Fino al raggiungimento della maggiore età | 3
Normativa Statale e Regionale | Chi stabilisce la tipologia della scritta in nero “servizio pubblico” che ogni vettura adibita al servizio taxi deve possedere? | L’ufficio comunale competente | L’ufficio regionale competente | L’ufficio apposito della Camera di commercio, industria, artigianato e agricoltura della provincia d’appartenenza | 1
Normativa Statale e Regionale | Gli autoservizi pubblici non di linea sono quelli che: | Provvedono al solo trasporto individuale di persone | Provvedono al solo servizio collettivo di persone | Provvedono sia al trasporto individuale che collettivo di persone | 3
Normativa Statale e Regionale | Quale funzione svolgono gli autoservizi pubblici non di linea rispetto ai trasporti pubblici di linea ferroviari, automobilistici, marittimi, lacuali ed aerei? | Nessuna funzione | Funzione complementare ed integrativa | Funzione sostitutiva | 2
Normativa Statale e Regionale | Quale di queste caratteristiche riguardano gli autoservizi pubblici non di linea? | Vengono effettuati a richiesta in modo non continuativo o periodico, su itinerari e secondo orari stabiliti di volta in volta | Vengono effettuati in modo continuativo o periodico, su itinerari e orari fissi | Vengono effettuati solo su richiesta della Prefettura in caso di grave calamità o per ragioni di pubblica utilità | 1
Normativa Statale e Regionale | Costituiscono autoservizi pubblici non di linea: | Il servizio di taxi e il servizio di autonoleggio con conducente | Il servizio di autonoleggio senza conducente | Il servizio di autoambulanza | 1
Normativa Statale e Regionale | Quale tra questi veicoli non può essere adibito a servizio pubblico non di linea ai sensi della Legge 15 gennaio 1992 n. 21? | Motocarrozzetta | Veicolo a trazione animale | Autoambulanza | 3
Normativa Statale e Regionale | La Legge 15 gennaio 1992 n. 21 è: | La legge quadro per il trasporto di persone mediante autoservizi pubblici non di linea | La legge quadro sui trasporti pubblici locali di linea | La legge che riguarda interventi in materia di opere pubbliche | 1
Normativa Statale e Regionale | Dove sosta il taxi per svolgere il servizio? | In una autorimessa situata nel comune che ha rilasciato la licenza | In luogo pubblico | Esclusivamente su marciapiede appositamente attrezzati | 2
Normativa Statale e Regionale | La prestazione del servizio taxi all’interno delle aree comunali è obbligatoria? | Si | No | Solo in caso di pubblica necessità | 1
Normativa Statale e Regionale | In caso di mancata prestazione del servizio taxi sono previste idonee sanzioni amministrative. Da chi sono stabilite? | Dalla Regione | Dalla Prefettura | Dal Direttore provinciale della Motorizzazione Civile | 1
Normativa Statale e Regionale | Con quali procedure il comune concede le licenze per servizio taxi e l’autorizzazione per il servizio di noleggio con conducente? | In base all’ordine cronologico di presentazione delle domande degli interessati | Attraverso bando di pubblico concorso | Per sorteggio fra tutti i richiedenti aventi diritto | 2
Normativa Statale e Regionale | Al titolare di licenza di taxi che abbia trasferito ad altri tale titolo può essere attribuita una nuova licenza per concorso pubblico? | No | Si, dopo tre anni dal trasferimento | Si, dopo sette anni dal trasferimento | 1
Normativa Statale e Regionale | Il termine entro il quale i comuni devono rendere conformi i regolamenti comunali alle norme della Legge 15 gennaio 1992 n. 21 è: | Diciotto mesi dalla nomina dei sindaci | Due anni dall’entrata in vigore della Legge 15 gennaio 1992 n. 21 | Dodici mesi dalla convocazione dei comizi elettorali | 2
Normativa Statale e Regionale | Gli autoservizi pubblici non di linea come vengono definiti ai sensi della L. 21/92 art. 1 c. 1? | Servizi con funzione complementare e integrativa a quelli di linea con qualsiasi mezzo effettuati | Servizi svolti senza obbligo di aderire alla richiesta di trasporto | Servizi ad offerta non indifferenziata | 1
Normativa Statale e Regionale | Ai sensi della L. 21/92 art. 1 c. 1 che cosa distingue gli autoservizi pubblici non di linea da quelli di linea? | L’offerta riservata a particolari categorie di utenti | La non continuità e periodicità e lo svolgimento su itinerari e con orari non predeterminati | Le tariffe contrattabili liberamente | 2
Normativa Statale e Regionale | Ai sensi della L. 21/92 art. 1 c. 2 quali sono gli autoservizi pubblici non di linea? | Taxi e noleggio con conducente con autovettura, natante, motocarrozzetta e veicolo a trazione animale | Servizio da piazza e servizio di rimessa, svolti con qualsiasi tipo di auto o motoveicolo | Taxi, noleggio senza conducente, noleggio con conducente | 1
Normativa Statale e Regionale | Le tariffe del servizio di taxi ai sensi della L. 21/92 art. 2 c. 1 da chi sono determinate? | Dalla libera contrattazione tra il cliente e il vettore, entro i limits minimi e massimi comunali | Dagli organi competenti che stabiliscono le modalità del servizio | Dalla Camera di Commercio | 2
Normativa Statale e Regionale | Ai sensi della L. 21/92 art. 2 c. 1 dove deve avvenire il prelevamento dell’utente o l’inizio del servizio taxi? | Esclusivamente entro l’area comunale | Entro l’area comunale o comprensoriale | Entro l’area provinciale | 2
Normativa Statale e Regionale | Ai sensi della L. 21/92 art. 2 c. 1 dove può avvenire lo stazionamento dei veicoli adibiti a servizio taxi, durante il servizio stesso? | Esclusivamente su suolo pubblico, in aree specificatamente individuate | Esclusivamente su piazze | Indifferentemente su suolo pubblico o presso apposite rimesse private | 1
Normativa Statale e Regionale | Ai sensi della L. 21/92 art. 2 c. 1 qual è lo scopo del servizio taxi? | Soddisfa esigenze di trasporto individuale o di piccoli gruppi | Soddisfa esigenze solo di trasporto individuale | Soddisfa esigenze di trasporto di qualsiasi genere, anche con contratto di noleggio | 1
Normativa Statale e Regionale | La prestazione del servizio di taxi, ai sensi della L. 21/92 art. 2 c. 2, dov’è obbligatoria? | Per qualsiasi destinazione, anche esterna al limite dell’area in cui è consentito acquisire utenza | Entro l’area provinciale| Entro l’area comunale o comprensoriale | 3
Normativa Statale e Regionale | Ai sensi della L. 21/92 art. 2 c. 2, quale ente determina le sanzioni per l’inosservanza dell’obbligatorietà della prestazione del servizio taxi? | Il Comune | La Provincia |La Regione | 3
Normativa Statale e Regionale | Il servizio di noleggio con conducente, ai sensi della L. 21/92 art. 3, a chi è rivolto? | Ad una utenza indifferenziata | All’’utenza specifica che si deve rivolgere presso la sede del vettore | All’utenza specifica che prenota presso le apposite aree pubbliche di stazionamento | 2
Normativa Statale e Regionale | Ai sensi della L. 21/92 art. 3, come possono essere effettuate le prestazioni di noleggio di veicoli con conducente? | A tempo e/o viaggio | Solo a tempo | Solo a viaggio | 1
Normativa Statale e Regionale | Lo stazionamento dei mezzi addetti al servizio di noleggio con conducente, ai sensi della L. 21/92 art. 3, dove avviene? | Presso apposite autorimesse pubbliche | Su suolo privato, in apposite rimesse | Su suolo pubblico in aree specificatamente contrassegnate | 2
Normativa Statale e Regionale | Ai sensi della L. 21/92 art. 4 c. 3, con quale fine dev’essere ricercata l’uniformazione delle regolamentazioni comunali all’interno delle aree comprensoriali? | Per evitare concorrenze indebite tra taxisti e noleggiatori di comuni limitrofi | Per ottenere una maggiore razionalità ed efficienza del servizio pubblico non di linea | Per limitare il numero delle licenze e delle autorizzazioni al minimo possibile | 2
Normativa Statale e Regionale | Ai sensi della L. 21/92 art. 4 c. 5, gli autoservizi pubblici non di linea sono disciplinati solo da regolamenti di esercizio predisposti dai Comuni? | No, possono essere emanate anche norme speciali della Regione nel rispetto delle competenze comunali | No, sono regolati anche dalle disposizioni delle Province | No, sono regolati anche dalle disposizioni delle Camere di Commercio | 1
Normativa Statale e Regionale | Ai sensi della L. 21/92 art. 6 c. 1, presso quale ente è istituito il ruolo dei conducenti di veicoli adibiti ad autoservizi pubblici non di linea? | La Camera di Commercio del capoluogo di regione | La Camera di Commercio di ciascuna provincia | La Provincia | 2
Normativa Statale e Regionale | Ai sensi della L. 21/92 art. 6 c. 2, qual è l’unico requisito indispensabile, per legge statale, per ottenere l’iscrizione a ruolo dei conducenti di veicoli adibiti ad autoservizi pubblici non di linea? | La sola patente | La licenza o l’autorizzazione | Il certificato di abilitazione professionale | 3
Normativa Statale e Regionale | Ai sensi della L. 21/92 art. 7 è possibile rientrare in possesso di licenze o autorizzazioni per autoservizi pubblici non di linea conferite ad organismi cooperativi? | No | Si, in caso di recesso, decadenza o esclusione | Si, in qualsiasi caso | 2
Normativa Statale e Regionale | Ai sensi della L. 21/92 art. 7 le persone giuridiche possono essere titolari di licenza o autorizzazione per autoservizi pubblici n
